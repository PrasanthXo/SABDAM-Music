name: TEMP Search Playback Diagnostic

on:
  push:
    branches:
      - fix/search-playlist-detail-2026-10-03
    paths:
      - ".github/workflows/temp-search-playback-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Gangnam direct catalog
        shell: bash
        run: |
          set -e
          for q in "PSY Gangnam Style" "PSY 6 Gangnam Style" "PSY 6 Six Rules Part 1" "Gangnam Style Korean PSY"
          do
            echo "=== $q ==="
            encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$q")
            curl -fsS -m 20 "https://www.jiosaavn.com/api.php?__call=search.getResults&_format=json&n=25&p=1&q=$encoded&_marker=0" -o /tmp/jsq.json || true
            python3 -c "import json; d=json.load(open('/tmp/jsq.json')); [print((x.get('song') or ''),'|',(x.get('primary_artists') or x.get('singers') or ''),'|',(x.get('album') or ''),'|',(x.get('language') or ''),'|',(x.get('id') or '')) for x in (d.get('results') or [])[:15]]" || true
          done
