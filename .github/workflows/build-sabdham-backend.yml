name: Build SABDHAM Backend

on:
  push:
    branches: [ main ]
    paths:
      - "server.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/build-sabdham-backend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend and web bundle
        run: npm run build
