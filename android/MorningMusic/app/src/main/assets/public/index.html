    <div id="root" style="background-color: #121212; min-height: 100vh;">
      <!-- Immediate initial dark loading placeholder to guarantee no white screen -->
      <div id="app-boot-loading" style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: #121212; color: #a1a1aa; font-family: 'Plus Jakarta Sans', sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
          <div style="width: 48px; height: 48px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(245, 158, 11, 0.4); box-shadow: 0 4px 20px rgba(245, 158, 11, 0.2);">

          </div>
          <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: #f4f4f5;">SABDHAM</div>
          <div style="width: 24px; height: 24px; border: 2px solid rgba(29, 185, 84, 0.3); border-top-color: #1db954; border-radius: 50%; animation: sabdham-spin 0.8s linear infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes sabdham-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script>
      setTimeout(function() {
        var loader = document.getElementById('app-boot-loading');
        if (loader && !document.getElementById('boot-reload-btn')) {
          var btn = document.createElement('button');
          btn.id = 'boot-reload-btn';
          btn.innerText = 'Tap to Reload Player';
          btn.style.marginTop = '12px';
          btn.style.padding = '8px 18px';
          btn.style.backgroundColor = '#1db954';
          btn.style.color = '#000000';
          btn.style.fontWeight = '700';
          btn.style.fontSize = '12px';
          btn.style.borderRadius = '9999px';
          btn.style.border = 'none';
          btn.style.cursor = 'pointer';
          btn.onclick = function() { window.location.reload(); };
          var container = loader.querySelector('div');
          if (container) container.appendChild(btn);
        }
      }, 5000);
    </script>
