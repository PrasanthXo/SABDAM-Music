name: TEMP Search Playback Diagnostic

on:
  push:
    branches:
      - fix/search-playlist-detail-2026-10-03
    paths:
      - ".github/workflows/temp-search-playback-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Invidious redirect mode
        shell: bash
        run: |
          set +e
          for base in \
            https://inv.nadeko.net \
            https://invidious.nerdvpn.de \
            https://invidious.tiekoetter.com \
            https://invidious.no-logs.com \
            https://invidious.f5.si \
            https://yewtu.be
          do
            echo "=== $base local=false ==="
            curl -sS -m 15 -D - -o /tmp/body "$base/latest_version?id=9bZkp7q19f0&itag=140&local=false" | grep -iE 'HTTP/|location:|content-type:|content-length:' | tail -10
            echo "BODY:"
            head -c 80 /tmp/body | xxd -g 1
            echo
            echo "=== $base no-local ==="
            curl -sS -m 15 -D - -o /tmp/body "$base/latest_version?id=9bZkp7q19f0&itag=140" | grep -iE 'HTTP/|location:|content-type:|content-length:' | tail -10
            echo "BODY:"
            head -c 80 /tmp/body | xxd -g 1
            echo
          done
