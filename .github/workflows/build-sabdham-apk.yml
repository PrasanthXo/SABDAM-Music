name: Build SABDHAM APK
# Trigger online build

on:
  push:
    branches: [ main ]
    paths:
      - "android/MorningMusic/**"
      - ".github/workflows/build-sabdham-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/MorningMusic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SABDHAM-latest-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SABDHAM-latest-debug
          path: android/MorningMusic/app/build/outputs/apk/debug/SABDHAM-latest-debug.apk
          if-no-files-found: error
