name: Temp Render Audius Check

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live Render health and Audius fallback
        run: |
          set -euxo pipefail
          echo "=== HEALTH ==="
          curl -i --fail-with-body --max-time 30 https://sabdham-backend.onrender.com/health || true
          echo
          echo "=== API HEALTH ==="
          curl -i --fail-with-body --max-time 30 https://sabdham-backend.onrender.com/api/health || true
          echo
          echo "=== AUDIUS ==="
          curl -i --fail-with-body --max-time 40 'https://sabdham-backend.onrender.com/api/audius/resolve?title=Gangnam%20Style&artist=PSY' || true
