name: Keep SABDHAM Backend Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping SABDHAM backend
        run: |
          echo "Pinging SABDHAM backend..."
          curl -fsS \
            --retry 2 \
            --retry-delay 5 \
            --max-time 30 \
            https://sabdham-backend.onrender.com/api/health